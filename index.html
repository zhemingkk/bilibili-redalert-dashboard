<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>《红警：荣耀》内容生态与用户洞察研究</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="wrap">
    <section class="split-hero">
      <div class="split-left">
        <div class="giant" id="giantLeft">—</div>
        <p class="eyebrow">Research</p>
        <h1>内容生态与<br/>用户洞察研究</h1>
        <p class="prop">研究红警IP内容生态、玩家真实诉求与新品发行内容机会。</p>
        <div class="progress-line"><span id="heroBar" style="width:42%"></span></div>
        <div class="pill-row">
          <span class="pill">Bilibili</span>
          <span class="pill">Douyin</span>
          <span class="pill">WeChat</span>
        </div>
        <div class="updated" id="updated">研究更新时间加载中…</div>
      </div>
      <div class="split-plus" aria-hidden="true">+</div>
      <div class="split-right" id="coverageHero">
        <div class="giant coral" id="giantRight">—</div>
        <p class="eyebrow">Coverage</p>
        <h1>样本覆盖</h1>
        <p class="prop">研究规模，不是业务成绩。</p>
        <div class="glass-panel" id="glassPanel">
          <div class="glass-head">
            <span class="glass-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            research.coverage.md
          </div>
          <pre id="glassBody">加载中…</pre>
        </div>
      </div>
    </section>

    <section class="section-pad">
      <div class="section-head">
        <h2>阶段性核心发现</h2>
        <div class="desc">结论优先 · 数据作证据 · 非最终策略</div>
      </div>
      <div class="findings" id="findings"></div>
    </section>

    <section class="section-pad" style="padding-top:0;">
      <div class="section-head">
        <h2>平台研究进展</h2>
        <div class="desc">进入各平台完整研究页</div>
      </div>
      <div class="platform-grid" id="platforms"></div>
    </section>

    <section class="method-box">
      <h2>研究说明与口径</h2>
      <div id="method"></div>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    RADash.renderNav("overview");
    (async () => {
      try {
        const meta = await RADash.loadJSON("data/overview/meta.json");
        const dk = meta.douyin_kpis || {};
        const bk = meta.bilibili_kpis || null;
        const wk = meta.wechat_kpis || {};
        document.getElementById("updated").textContent = "更新时间：" + (meta.generated_at || "—");

        const formal = Number(dk.formal_sample_works) || 0;
        const mp = Number(wk.mp_formal_sample) || 0;
        const ch = Number(wk.channels_formal_sample) || 0;
        const bili = Number(bk?.n_videos) || 0;
        const comments = Number(dk.comment_corpus) || 0;

        // Left: completed platform count as poster weight; Right: primary coral sample
        document.getElementById("giantLeft").textContent = "4";
        document.getElementById("giantRight").textContent = RADash.fmt(formal);
        document.getElementById("heroBar").style.width = "50%";

        const lines = [
          ["01", `<span class="kw">platforms</span>: B站 / 抖音 / 微信公众号 / 视频号`],
          ["02", `<span class="kw">douyin_formal</span>: ${RADash.fmt(formal)}`],
          ["03", `<span class="kw">douyin_comments</span>: ${RADash.fmt(comments)}`],
          ["04", `<span class="kw">mp_formal</span>: ${RADash.fmt(mp)}`],
          ["05", `<span class="kw">channels_formal</span>: ${RADash.fmt(ch)}`],
          ["06", `<span class="kw">bilibili_videos</span>: ${RADash.fmt(bili)}`],
          ["07", `<span class="kw">note</span>: research scale, not KPI`],
          ["08", `<span class="kw">status</span>: wechat integrated`],
        ];
        document.getElementById("glassBody").innerHTML = lines.map(([n, t]) =>
          `<span class="ln">${n}</span>${t}`
        ).join("\n");

        const findings = [
          {
            idx: "01",
            title: "红警内容供给高度集中于 IP符号与AIGC",
            text: "在当前抖音正式红警样本中，IP符号与AIGC是高覆盖内容方向。这描述的是供给结构，不代表“最佳内容”。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "红警 80 作品 · 内容标签统计",
            compact: false,
          },
          {
            idx: "02",
            title: "RTS诉求真实存在，但表达不只叫“RTS”",
            text: "玩家更多通过 3D / 对战 / 重制 / 经典玩法等语言表达相关需求；字面“RTS/即时战略”极少。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "红警评论 1280 · RTS相关约 60",
            compact: false,
          },
          {
            idx: "03",
            title: "玩家说的“还原”不是单一玩法还原",
            text: "当前讨论更多包含单位识别、情绪记忆、经典元素，以及部分玩法期待。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "评论主题标注 · 经典还原侧面",
            compact: true,
          },
          {
            idx: "04",
            title: "AIGC 的价值目前更多体现在“新游戏想象”",
            text: "正向评论更集中于视觉冲击、电影感，以及“如果做成游戏”的想象。视觉质量 / AI痕迹专项尚未完成。",
            tag: "待验证",
            tagClass: "pending",
            evidence: "AIGC相关评论反馈 · 视觉样本 15",
            limit: true,
            compact: true,
          },
        ];
        document.getElementById("findings").innerHTML = findings.map((f) => `
          <article class="finding ${f.limit ? "limit" : ""} ${f.compact ? "compact" : ""}">
            <div class="idx">${f.idx}</div>
            <div>
              <h3>${f.title}</h3>
              <p>${f.text}</p>
              <div class="meta">
                <span class="tag ${f.tagClass}">${f.tag}</span>
                <span class="tag evidence">证据 · ${f.evidence}</span>
              </div>
            </div>
          </article>`).join("") + `
          <div class="coverage">
            <div class="label-soft">平台进展</div>
            <div><strong>微信研究已完成</strong> · 公众号与视频号成果已接入。阶段性跨平台综合见策略页。</div>
          </div>`;

        const platforms = [
          {
            name: "B站",
            status: "Done",
            wait: false,
            stats: bk
              ? `${RADash.fmt(bk.n_videos)} 视频 / ${RADash.fmt(bk.n_comments)} 评论 / ${RADash.fmt(bk.n_ups)} UP`
              : "已完成独立研究（详见完整看板）",
            href: "platforms/bilibili.html",
            cta: "Open",
          },
          {
            name: "抖音",
            status: "Done",
            wait: false,
            stats: `${RADash.fmt(dk.formal_sample_works)} 正式样本 / ${RADash.fmt(dk.comment_corpus)} 评论`,
            href: "platforms/douyin.html",
            cta: "Open",
          },
          {
            name: "微信公众号",
            status: "Done",
            wait: false,
            stats: `${RADash.fmt(wk.mp_formal_sample)} 正式样本 / ${RADash.fmt(wk.mp_fulltext_ok)} 正文成功`,
            href: "platforms/wechat.html",
            cta: "Open",
          },
          {
            name: "视频号",
            status: "Done",
            wait: false,
            stats: `${RADash.fmt(wk.channels_formal_sample)} 正式样本 / ${RADash.fmt(wk.channels_visual_cases)} 视觉案例`,
            href: "platforms/wechat.html",
            cta: "Open",
          },
        ];
        document.getElementById("platforms").innerHTML = platforms.map((p) => `
          <div class="platform-card">
            <h3>${p.name}</h3>
            <div class="status ${p.wait ? "wait" : ""}">${p.status}</div>
            <div class="stats">${p.stats}</div>
            <a class="btn ghost" href="${p.href}">${p.cta}</a>
          </div>`).join("");

        const dv = meta.data_version || {};
        document.getElementById("method").innerHTML = `
          <p>${(meta.scope || []).join(" ")}</p>
          <p>微信研究已完成。本页不生成新的跨平台综合结论。</p>
          <p>内部数据版本（供追溯）：抖音样本 ${dv.douyin_sample || "—"}；微信公众号 ${dv.wechat_mp || "—"}；视频号 ${dv.wechat_channels || "—"}；B站 ${dv.bilibili || "—"}。</p>
          <p>更新看板数据：在本地工程运行数据构建脚本后刷新本站。</p>`;
      } catch (e) {
        RADash.showError(e);
      }
    })();
  </script>
</body>
</html>
