<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>《红警：荣耀》内容生态与用户洞察研究</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="wrap">
    <header class="page-hero">
      <h1>《红警：荣耀》<br/>内容生态与用户洞察研究</h1>
      <p class="sub">B站 · 抖音 · 微信生态</p>
      <p class="prop">研究红警IP内容生态、玩家真实诉求与新品发行内容机会</p>
      <div class="updated" id="updated">研究更新时间加载中…</div>
    </header>

    <!-- 1. Core findings first -->
    <section>
      <div class="section-head">
        <h2>阶段性核心发现</h2>
        <div class="desc">结论优先 · 数据作证据 · 非最终策略</div>
      </div>
      <div class="findings" id="findings"></div>
    </section>

    <!-- 2. Coverage strip -->
    <section>
      <div class="section-head">
        <h2>研究覆盖</h2>
        <div class="desc">这是研究规模，不是业务成绩</div>
      </div>
      <div class="coverage" id="coverage"></div>
    </section>

    <!-- 3. Platform matrix -->
    <section>
      <div class="section-head">
        <h2>平台研究进展</h2>
      </div>
      <div class="platform-grid" id="platforms"></div>
    </section>

    <!-- 4. Method at bottom -->
    <section class="method-box">
      <h2>研究说明与口径</h2>
      <div id="method"></div>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    RADash.renderNav("overview");
    (async () => {
      try {
        const meta = await RADash.loadJSON("data/overview/meta.json");
        const dk = meta.douyin_kpis || {};
        const bk = meta.bilibili_kpis || null;
        const wk = meta.wechat_kpis || {};
        document.getElementById("updated").textContent = "更新时间：" + (meta.generated_at || "—");

        // Findings from verified WP-05A1 / sample facts only — no new cross-platform synthesis
        const findings = [
          {
            idx: "01",
            title: "红警内容供给高度集中于 IP符号与AIGC",
            text: "在当前抖音正式红警样本中，IP符号与AIGC是高覆盖内容方向。这描述的是供给结构，不代表“最佳内容”。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "红警 80 作品 · 内容标签统计",
          },
          {
            idx: "02",
            title: "RTS诉求真实存在，但表达不只叫“RTS”",
            text: "玩家更多通过 3D / 对战 / 重制 / 经典玩法等语言表达相关需求；字面“RTS/即时战略”极少。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "红警评论 1280 · RTS相关约 60",
          },
          {
            idx: "03",
            title: "玩家说的“还原”不是单一玩法还原",
            text: "当前讨论更多包含单位识别、情绪记忆、经典元素，以及部分玩法期待。",
            tag: "阶段性",
            tagClass: "stage",
            evidence: "评论主题标注 · 经典还原侧面",
          },
          {
            idx: "04",
            title: "AIGC 的价值目前更多体现在“新游戏想象”",
            text: "正向评论更集中于视觉冲击、电影感，以及“如果做成游戏”的想象。视觉质量 / AI痕迹专项尚未完成。",
            tag: "待验证",
            tagClass: "pending",
            evidence: "AIGC相关评论反馈 · 视觉样本 15",
            limit: true,
          },
        ];
        document.getElementById("findings").innerHTML = findings.map((f) => `
          <article class="finding ${f.limit ? "limit" : ""}">
            <div class="idx">${f.idx}</div>
            <h3>${f.title}</h3>
            <p>${f.text}</p>
            <div class="meta">
              <span class="tag ${f.tagClass}">${f.tag}</span>
              <span class="tag evidence">证据 · ${f.evidence}</span>
            </div>
          </article>`).join("") + `
          <div class="coverage" style="grid-column:1/-1;margin-top:2px;">
            <div class="label-soft">平台进展</div>
            <div><strong>微信研究已完成</strong> · 公众号与视频号成果已接入。跨平台综合结论待下一阶段。</div>
          </div>`;

        document.getElementById("coverage").innerHTML = `
          <div class="label-soft">研究覆盖（正式样本口径 · 非业务 KPI）</div>
          <div><strong>${RADash.fmt(dk.candidate_accounts)}</strong>抖音账号</div>
          <div><strong>${RADash.fmt(dk.formal_sample_works)}</strong>抖音正式样本</div>
          <div><strong>${RADash.fmt(dk.comment_corpus)}</strong>抖音评论</div>
          <div><strong>${RADash.fmt(wk.mp_formal_sample)}</strong>公众号正式样本</div>
          <div><strong>${RADash.fmt(wk.channels_formal_sample)}</strong>视频号正式样本</div>
          <div><strong>${RADash.fmt(bk?.n_videos)}</strong>B站视频快照</div>`;

        const platforms = [
          {
            name: "B站",
            status: "已完成",
            wait: false,
            stats: bk
              ? `${RADash.fmt(bk.n_videos)} 视频 / ${RADash.fmt(bk.n_comments)} 评论 / ${RADash.fmt(bk.n_ups)} UP`
              : "已完成独立研究（详见完整看板）",
            href: "platforms/bilibili.html",
            cta: "查看研究",
          },
          {
            name: "抖音",
            status: "已完成核心研究",
            wait: false,
            stats: `${RADash.fmt(dk.formal_sample_works)} 正式样本 / ${RADash.fmt(dk.comment_corpus)} 评论`,
            href: "platforms/douyin.html",
            cta: "查看研究",
          },
          {
            name: "微信公众号",
            status: "已完成",
            wait: false,
            stats: `${RADash.fmt(wk.mp_formal_sample)} 正式样本 / ${RADash.fmt(wk.mp_fulltext_ok)} 正文成功`,
            href: "platforms/wechat.html",
            cta: "查看研究",
          },
          {
            name: "视频号",
            status: "已完成",
            wait: false,
            stats: `${RADash.fmt(wk.channels_formal_sample)} 正式样本 / ${RADash.fmt(wk.channels_visual_cases)} 视觉案例`,
            href: "platforms/wechat.html",
            cta: "查看研究",
          },
        ];
        document.getElementById("platforms").innerHTML = platforms.map((p) => `
          <div class="platform-card">
            <h3>${p.name}</h3>
            <div class="status ${p.wait ? "wait" : ""}">${p.status}</div>
            <div class="stats">${p.stats}</div>
            <a class="btn ${p.wait ? "ghost" : ""}" href="${p.href}">${p.cta}</a>
          </div>`).join("");

        const dv = meta.data_version || {};
        document.getElementById("method").innerHTML = `
          <p>${(meta.scope || []).join(" ")}</p>
          <p>微信研究已完成。本页不生成新的跨平台综合结论。</p>
          <p>内部数据版本（供追溯）：抖音样本 ${dv.douyin_sample || "—"}；微信公众号 ${dv.wechat_mp || "—"}；视频号 ${dv.wechat_channels || "—"}；B站 ${dv.bilibili || "—"}。</p>
          <p>更新看板数据：在本地工程运行数据构建脚本后刷新本站。</p>`;
      } catch (e) {
        RADash.showError(e);
      }
    })();
  </script>
</body>
</html>
