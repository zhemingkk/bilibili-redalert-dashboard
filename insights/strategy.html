<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>红警荣耀策略｜《红警：荣耀》内容生态研究</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="wrap">
    <header class="page-hero">
      <p class="eyebrow">Strategy</p>
      <h1>红警荣耀策略</h1>
      <p class="sub">阶段性状态 · 尚未生成最终策略</p>

    </header>
    <div class="guard" style="margin: 20px clamp(28px, 4vw, 56px);">

      最终栏目体系、选题库、发行策略与甲方定稿方案尚未生成。

    <section class="platform-grid" style="margin-top:8px;" id="slots"></section>
  </main>
  <script src="../assets/js/app.js"></script>
  <script>
    RADash.renderNav("strategy");
    const slots = ["内容机会","风险管理","IP使用","新品发行","栏目体系","选题库","AIGC策略","预期管理"];
    document.getElementById("slots").innerHTML = slots.map(s => `
      <div class="platform-card">
        <h3>${s}</h3>
        <div class="status wait">待跨平台综合</div>
        <div class="stats">单平台研究已完成；交叉结论待下一阶段写入</div>
      </div>`).join("");
  </script>
</body>
