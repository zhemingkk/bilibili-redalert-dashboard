<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导出 PDF｜《红警：荣耀》研究结论</title>
  <script>
    /* Boot theme before paint. Print always prefers light for readability. */
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      var stored = null;
      try { stored = localStorage.getItem("ra-theme"); } catch (e) {}
      var theme = q || stored || "light";
      if (theme !== "dark") theme = "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #faf2e7;
      --ink: #1a1814;
      --ink-soft: #3d3a34;
      --muted: #6b6560;
      --faint: #9a938a;
      --accent: #e07848;
      --accent-soft: #c45a32;
      --accent-dim: rgba(224, 120, 72, 0.14);
      --line: rgba(20, 20, 19, 0.12);
      --surface: #fffbf5;
      --surface-2: #f0e8dd;
      --panel: #fffbf5;
      --font: "DM Sans", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --display: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #2e2822;
      --ink: #f3ebe0;
      --ink-soft: #e4d9cb;
      --muted: #a89888;
      --faint: #877868;
      --accent: #f07040;
      --accent-soft: #f08a5c;
      --accent-dim: rgba(240, 112, 64, 0.22);
      --line: rgba(243, 235, 224, 0.14);
      --surface: #37312b;
      --surface-2: #413a33;
      --panel: #37312b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink-soft);
      background: var(--bg);
      line-height: 1.65;
      font-size: 14.5px;
      -webkit-font-smoothing: antialiased;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .toolbar p { margin: 0; color: var(--muted); font-size: 12px; max-width: 52ch; }
    .toolbar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
    }
    .primary { background: var(--accent); color: #faf2e7; }
    .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .doc {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 28px 72px;
    }
    .cover {
      text-align: center;
      padding: 40px 20px 32px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }
    .cover h1 {
      margin: 0 0 12px;
      font-family: var(--display);
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.15;
    }
    .cover .sub { margin: 0; color: var(--muted); }
    .cover .prop {
      margin: 14px auto 0;
      max-width: 52ch;
      color: var(--ink-soft);
    }
    .cover .bar {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 22px auto 0;
    }
    .meta-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 0 22px;
    }
    .meta-strip div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .meta-strip .k {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .meta-strip .v {
      margin-top: 6px;
      font-family: var(--display);
      font-size: 18px;
      color: var(--ink);
    }
    .guard {
      border-left: 3px solid var(--accent);
      background: var(--accent-dim);
      padding: 14px 16px;
      margin-bottom: 28px;
      color: var(--ink);
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      line-height: 1.7;
    }
    h2 {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin: 32px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .sum-item {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .sum-item .idx {
      font-family: var(--display);
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
    }
    .sum-item h3 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 500;
      color: var(--ink);
    }
    .sum-item p { margin: 0; color: var(--ink-soft); }
    .section { margin-bottom: 22px; break-inside: avoid; page-break-inside: avoid; }
    .section-head {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }
    .section-head .n {
      font-family: var(--display);
      font-size: 36px;
      color: var(--accent);
      line-height: 1;
    }
    .section-head h3 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
    }
    .section-head .lead { margin: 0; color: var(--ink-soft); }
    .tags { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .point {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      break-inside: avoid;
    }
    .point h4 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
    }
    .point p { margin: 0 0 8px; color: var(--ink-soft); font-size: 13px; }
    .point .lab {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
      margin-top: 6px;
    }
    .point .val { color: var(--ink-soft); font-size: 12.5px; }
    .bound {
      margin-top: 10px;
      font-size: 13px;
      color: var(--ink-soft);
      border-left: 3px solid var(--accent);
      padding: 8px 0 8px 12px;
    }
    .sig {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .sig h4 { margin: 0 0 4px; color: var(--ink); font-size: 14px; }
    .sig p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 11px;
      text-align: center;
    }
    /* Print: ALWAYS Claude light cream — fixes dark-on-white ghost text */
    @media print {
      .toolbar { display: none !important; }
      :root, html, body, [data-theme="dark"], [data-theme="light"] {
        --bg: #faf2e7 !important;
        --ink: #1a1814 !important;
        --ink-soft: #3d3a34 !important;
        --muted: #6b6560 !important;
        --faint: #9a938a !important;
        --accent: #e07848 !important;
        --accent-dim: rgba(224, 120, 72, 0.14) !important;
        --line: rgba(20, 20, 19, 0.12) !important;
        --surface: #fffbf5 !important;
        --panel: #fffbf5 !important;
        color-scheme: light !important;
      }
      html, body {
        background: #faf2e7 !important;
        color: #3d3a34 !important;
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
      }
      .cover h1, h2, .sum-item h3, .section-head h3, .point h4, .sig h4, .meta-strip .v {
        color: #1a1814 !important;
      }
      .guard { color: #1a1814 !important; background: rgba(224, 120, 72, 0.14) !important; }
      .doc { max-width: none; padding: 10mm 12mm; }
      .points { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .points, .meta-strip { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <p id="toolbarHint">浅色奶油纸排版（推荐）。打印时强制浅色，避免深色字糊在白底上。</p>
    <div class="btns">
      <button type="button" class="ghost" id="themeBtn">深色预览</button>
      <button type="button" class="ghost" onclick="window.close()">关闭</button>
      <button type="button" class="primary" id="printBtn">打印 / 另存 PDF</button>
    </div>
  </div>
  <article class="doc" id="doc">加载中…</article>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/export.js"></script>
  <script>
    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function syncThemeBtn() {
      const light = document.documentElement.getAttribute("data-theme") !== "dark";
      document.getElementById("themeBtn").textContent = light ? "深色预览" : "浅色预览";
      document.getElementById("toolbarHint").textContent = light
        ? "浅色奶油纸排版（推荐）。打印时强制浅色，保证阅读对比度。"
        : "深色仅供屏幕预览。点击打印仍输出浅色 PDF，避免发灰不可读。";
    }

    document.getElementById("themeBtn").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("ra-theme", next); } catch (e) {}
      syncThemeBtn();
    };
    syncThemeBtn();

    (async () => {
      try {
        const pack = await RAExport.loadPack();
        const s = pack.strategy || {};
        const meta = pack.meta || {};
        document.getElementById("doc").innerHTML = `
          <header class="cover">
            <p class="eyebrow">研究结论导出</p>
            <h1>${esc(s.title)}</h1>
            <p class="sub">${esc(s.subtitle)}</p>
            <p class="prop">${esc(s.prop)}</p>
            <div class="bar"></div>
          </header>
          <div class="meta-strip">
            <div><div class="k">状态</div><div class="v">${esc(s.status)}</div></div>
            <div><div class="k">版本</div><div class="v">${esc(s.version)}</div></div>
            <div><div class="k">导出</div><div class="v">${esc((pack.exported_at || "").slice(0, 16).replace("T", " "))}</div></div>
          </div>
          <div class="guard">${esc(s.guard)}</div>

          <h2>综合摘要</h2>
          ${(s.summary || []).map((f) => `
            <div class="sum-item">
              <div class="idx">${esc(f.idx)}</div>
              <div>
                <h3>${esc(f.title)}</h3>
                <p>${esc(f.text)}</p>
              </div>
            </div>`).join("")}

          <h2>策略八槽</h2>
          ${(s.sections || []).map((sec) => `
            <section class="section">
              <div class="section-head">
                <div class="n">${esc(sec.idx)}</div>
                <div>
                  <h3>${esc(sec.title)}</h3>
                  <p class="lead">${esc(sec.lead)}</p>
                  <div class="tags">
                    <span class="tag">${esc(sec.status)}</span>
                    <span class="tag">置信 ${esc(sec.confidence)}</span>
                  </div>
                </div>
              </div>
              <div class="points">
                ${(sec.points || []).map((p) => `
                  <div class="point">
                    <h4>${esc(p.title)}</h4>
                    <p>${esc(p.text)}</p>
                    <div class="lab">平台</div>
                    <div class="val">${esc((p.platforms || []).join(" / "))}</div>
                    <div class="lab">证据</div>
                    <div class="val">${esc(p.evidence)}</div>
                    <div class="lab">可执行</div>
                    <div class="val">${esc(p.action)}</div>
                  </div>`).join("")}
              </div>
              <div class="bound"><strong>边界：</strong>${esc(sec.boundary)}</div>
            </section>`).join("")}

          <h2>平台阶段性信号</h2>
          ${(meta.stage_signals || []).map((sig) => `
            <div class="sig">
              <h4>${esc(sig.title)}</h4>
              <p>${esc(sig.text)}</p>
            </div>`).join("")}
          ${(pack.wechat?.core_findings || []).map((f) => `
            <div class="sig">
              <h4>微信 · ${esc(f.idx)} ${esc(f.title)}</h4>
              <p>${esc(f.text)}</p>
            </div>`).join("")}

          <h2>下一步</h2>
          <ul>
            ${(s.next_steps || []).map((x) => `<li>${esc(x)}</li>`).join("")}
          </ul>

          <div class="footer">
            《红警：荣耀》内容生态研究 · 阶段性综合导出 · 非甲方最终定稿
          </div>`;

        document.getElementById("printBtn").onclick = () => {
          document.documentElement.setAttribute("data-theme", "light");
          syncThemeBtn();
          setTimeout(() => window.print(), 80);
        };
        const params = new URLSearchParams(location.search);
        if (params.get("auto") === "1") {
          document.documentElement.setAttribute("data-theme", "light");
          syncThemeBtn();
          setTimeout(() => window.print(), 700);
        }
      } catch (err) {
        document.getElementById("doc").textContent = "加载失败：" + err;
      }
    })();
  </script>
</body>
</html>
